name: Weekly opponent report

on:
  schedule:
    # Tuesday 14:00 UTC (9-10am ET), September through February.
    - cron: "0 14 * 9-12,1,2 2"
    # Wednesday retry, in case Monday night's play-by-play wasn't published yet
    # (the freshness data test fails and Tuesday's run stops before publishing).
    - cron: "0 14 * 9-12,1,2 3"
    # Update runs: refresh the published week's injury reports, lines and
    # game-day weather on the live page (no new report, archive untouched).
    # Thursday morning (TNF), Saturday morning (final injury statuses for
    # Sunday), Sunday early morning (game-day forecast, before the London
    # 9:30 ET kickoffs) and Monday morning (MNF).
    - cron: "0 14 * 9-12,1,2 4"
    - cron: "0 14 * 9-12,1,2 6"
    - cron: "0 11 * 9-12,1,2 0"
    - cron: "0 14 * 9-12,1,2 1"
  # The laptop pushes W2's newest predictions (_tools/w2_refresh.ps1): rebuild
  # the live page's data right away, as an update run.
  push:
    branches: [main]
    paths: [config/w2_predictions.csv]
  workflow_dispatch:
    inputs:
      mode:
        description: "full = build and publish the weekly report; update = refresh live data only"
        type: choice
        options: [full, update]
        default: full
      team:
        description: "Team whose next opponent to scout"
        default: "CHI"
      date:
        description: "Pretend today is (YYYY-MM-DD). Blank = today."
        default: ""

permissions:
  contents: write   # commit the new report into the archive
  pages: write
  id-token: write
  issues: write     # the "Trades to confirm" issue from the league roster check

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FOCAL_TEAM: ${{ inputs.team || 'CHI' }}
      REPORT_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      # Load -> build models -> data tests -> render. Any failure stops here,
      # nothing below runs, and the last good report stays on the site.
      - name: Run pipeline
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MODE_INPUT: ${{ github.event_name == 'push' && 'update' || inputs.mode }}
        run: |
          if [ -z "$REPORT_DATE" ]; then unset REPORT_DATE; fi
          # Tuesday and Wednesday crons are full runs; the other crons are updates.
          mode="${MODE_INPUT:-full}"
          case "$SCHEDULE" in
            "") ;;
            *" 2"|*" 3") mode=full ;;
            *) mode=update ;;
          esac
          echo "RUN_MODE=$mode" >> "$GITHUB_ENV"
          echo "Run mode: $mode"
          if [ "$mode" = update ]; then Rscript run_pipeline.R --update; else Rscript run_pipeline.R; fi

      # The league roster check (check_league_moves() in R/pipeline.R) lists
      # team switches in the weekly rosters that no trade list has. Keep one
      # open issue with the latest list, so it reaches Chris by email instead
      # of sitting in the run log; close it when the list is empty.
      - name: Trades to confirm issue
        if: always() && github.ref == 'refs/heads/main' && env.FOCAL_TEAM == 'CHI'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=data/roster-moves-to-confirm.md
          [ -f "$f" ] || { echo "No roster check output"; exit 0; }
          title="Trades to confirm"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
                --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -s "$f" ]; then
            if [ -n "$num" ]; then gh issue edit "$num" --body-file "$f"
            else gh issue create --title "$title" --body-file "$f" --assignee "${{ github.repository_owner }}"; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Every team switch in the weekly rosters is on a trade list now."
          fi

      # Only the Bears' scheduled or manual runs on main touch the archive and
      # the live site. A run from another branch or for another team still
      # renders, and its reports are kept as a downloadable workflow artifact.
      - name: Add report to archive
        if: github.ref == 'refs/heads/main' && env.FOCAL_TEAM == 'CHI'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/reports site/data site/notes/drafts site/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            if [ "$RUN_MODE" = update ]; then
              git commit -m "Update: live data $(date -u +%Y-%m-%d)"
            else
              git commit -m "Report: $(ls -t site/reports/*.html | head -1 | xargs basename)"
            fi
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && env.FOCAL_TEAM == 'CHI'
        with:
          path: site

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' || env.FOCAL_TEAM != 'CHI'
        with:
          name: reports-${{ env.FOCAL_TEAM }}
          path: |
            site/reports
            site/data

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (inputs.team || 'CHI') == 'CHI'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
