name: Create or update renv.lock

# Run once by hand (Actions tab -> this workflow -> Run workflow) to pin the R
# packages listed in DESCRIPTION. It commits renv.lock plus renv's activation
# files. Run it again only when you add a package or want to upgrade.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages and snapshot
        run: |
          install.packages("renv")
          renv::init(bare = TRUE, restart = FALSE)
          renv::load()
          renv::settings$snapshot.type("explicit")
          renv::install(c("DBI", "duckdb", "ggplot2", "knitr", "nflreadr", "rmarkdown", "scales"))
          renv::snapshot(prompt = FALSE)
        shell: Rscript {0}

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renv.lock .Rprofile renv/activate.R renv/settings.json renv/.gitignore
          git commit -m "Pin R packages with renv" || echo "No changes"
          git push origin HEAD:main
